<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>카멜레온</title>
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 글꼴은 페이지를 막지 않게 따로 불러옴. 못 불러와도 기기 기본 한글 글꼴로 보임 -->
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--fun:'Jua','Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--ui:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR','Noto Sans CJK KR','Nanum Gothic',system-ui,sans-serif;--title:'Do Hyeon','Jua','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR','Noto Sans CJK KR','Nanum Gothic',system-ui,sans-serif;
  --felt1:#1f7a63;--felt2:#0b3730;--ink:#1f2433;--paper:#fffaf0;
  --yellow:#ffc928;--blue:#2f7fe0;--green:#22a45d;--red:#ff5a4e;--orange:#ff8a2a;
  --shadow:0 6px 0 rgba(0,0,0,.28),0 12px 26px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--ui);-webkit-text-size-adjust:100%;color:var(--ink);background:radial-gradient(ellipse at 50% 15%,var(--felt1),var(--felt2) 78%) fixed;background-color:var(--felt2)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.6px);background-size:14px 14px;z-index:0}
#app{max-width:1000px;margin:0 auto;padding:12px 16px 48px;position:relative;z-index:1}
h2,h3{margin:.2em 0 .5em;font-weight:normal}
h2{font-size:26px} h3{font-size:22px}
p{line-height:1.5;margin:.4em 0}
.muted{color:#6b7080;font-size:15px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:14px;padding:11px 18px;font-size:17px;background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button.blue{background:var(--blue);color:#fff}
button.green{background:var(--green);color:#fff}
button.red{background:var(--red);color:#fff}
button.orange{background:var(--orange);color:#fff}
button.ghost{background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
button.ghostdark{background:#e9e3d4;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
button.sm{padding:6px 12px;font-size:15px;border-radius:10px}
button.big{width:100%;font-size:20px;padding:14px 18px;margin-top:10px}
input,select{font-family:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);width:100%;outline:none}
input:focus,select:focus{border-color:var(--blue)}
label{display:block;margin:10px 0 4px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.panel{background:var(--paper);border-radius:22px;padding:18px;box-shadow:var(--shadow);border:4px solid var(--ink)}
.narrow{max-width:520px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#fff}
.topbar .grow{flex:1;text-align:center;font-family:var(--title);font-size:20px;letter-spacing:1px}
.deckbadge{border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:14px;color:#fff}
.deckbadge.blue{background:var(--blue)} .deckbadge.green{background:var(--green)}

/* home */
.home{text-align:center;padding-top:18px}
.logo{font-family:var(--title);font-weight:normal;font-size:clamp(60px,16vw,100px);margin:0;line-height:1.05;letter-spacing:4px}
.logo span{display:inline-block;text-shadow:0 0 0 #1f2433,3px 3px 0 #1f2433,-2px -2px 0 #1f2433,2px -2px 0 #1f2433,-2px 2px 0 #1f2433,0 6px 0 #1f2433;animation:hop 2.8s ease-in-out infinite}
.logo span:nth-child(1){color:#ffc928}.logo span:nth-child(2){color:#8ee86a;animation-delay:.15s}.logo span:nth-child(3){color:#5ec8ff;animation-delay:.3s}.logo span:nth-child(4){color:#ff8f7a;animation-delay:.45s}
@keyframes hop{0%,70%,100%{transform:none}80%{transform:translateY(-8px)}}
@keyframes slide{to{background-position:200% 0}}
.tag{color:#fff;font-size:20px;margin:10px 0 24px;opacity:.95}
.menu{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.foot{color:rgba(255,255,255,.75);margin-top:28px;font-size:14px;line-height:1.7}
.shift{animation:hue 7s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* setup */
.nrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.nrow .num{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.opt{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15px;line-height:1.4}
.opt input{width:22px;height:22px;flex:none;margin-top:1px}
.or{text-align:center;margin:14px 0 6px;color:#8a8f9c}
.roomcode{text-align:center;font-size:18px}
.roomcode b{display:block;font-family:var(--title);font-size:54px;letter-spacing:8px;color:var(--blue)}
.plist{list-style:none;padding:0;margin:0 0 10px}
.plist li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:3px solid var(--ink);border-radius:12px;margin-bottom:6px;background:#fff}
.plist li span{flex:1}
.plist li span.pdot{flex:0 0 9px}
.row input{flex:1 1 140px;width:auto;min-width:0}
.divider{border:0;border-top:3px dashed #d8d0bd;margin:16px 0}

/* scores */
.scores{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 14px}
.chip{background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:999px;padding:3px 5px 3px 11px;font-size:15px;display:flex;gap:6px;align-items:center}
.chip .pts{background:var(--ink);color:#fff;border-radius:999px;padding:1px 9px}
.chip.dealer{background:var(--yellow)}
.chip.me{outline:3px solid #fff;outline-offset:1px}
.chip.off{opacity:.45}
.chip .delta{background:var(--green);color:#fff;border-radius:999px;padding:1px 7px;animation:pop .5s}
.target{color:#fff;font-size:14px;align-self:center;opacity:.85;margin-left:4px}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

/* layout */
.phase{margin:0 auto 16px;max-width:680px}
.table{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.tcol{flex:1 1 380px;max-width:460px;display:flex;justify-content:center}
.side{flex:0 1 330px;display:flex;flex-direction:column;gap:14px;align-items:center}

/* topic card */
.topic{--tc:#ff5a4e;background:var(--tc);border:4px solid var(--ink);border-radius:22px;padding:10px 10px 12px;box-shadow:var(--shadow);width:100%;animation:flipIn .5s}
.topic-head{text-align:center;color:#fff;padding:2px 0 8px}
.topic-head small{display:block;font-size:12px;letter-spacing:3px;opacity:.85}
.topic-head b{font-family:var(--title);font-weight:normal;font-size:28px;text-shadow:0 3px 0 rgba(0,0,0,.28)}
.tgrid{display:grid;grid-template-columns:24px repeat(4,1fr);gap:5px}
.colh,.rowh{display:flex;align-items:center;justify-content:center;font-family:var(--title);color:#fff;font-size:17px}
.colh span{background:var(--ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
.cell{background:var(--paper);border:3px solid var(--ink);border-radius:11px;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(13px,3.6vw,17px);padding:4px 3px;word-break:keep-all;line-height:1.15;transition:background .15s}
.cell.secret{background:var(--yellow);transform:scale(1.06);box-shadow:0 0 0 4px #fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px #fff}}
.cell.pick{cursor:pointer}
.cell.pick:hover{background:#ffe89a}
.cell.wrong{text-decoration:line-through;opacity:.45}
.topic.back{display:grid;place-items:center;min-height:320px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 12px,transparent 12px 24px),var(--tc,#3c4458)}
.tb-in{text-align:center;color:#fff}
.tb-in .tb-title{font-family:var(--title);font-size:30px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
@keyframes flipIn{from{transform:perspective(900px) rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}

/* dice */
.tray{display:flex;gap:18px;background:#6b3f1f;background:linear-gradient(#7a4a26,#5a3317);border:4px solid var(--ink);border-radius:20px;padding:14px 20px;box-shadow:var(--shadow);justify-content:center}
.die{text-align:center;color:#ffe9c7;font-size:13px}
.die svg{display:block;margin:0 auto 4px}
.rolling svg{animation:shake .14s linear infinite}
@keyframes shake{25%{transform:rotate(-14deg) translateY(-3px)}75%{transform:rotate(14deg) translateY(2px)}}

/* code card */
.codecard{--dc:var(--blue);background:var(--dc);border:4px solid var(--ink);border-radius:18px;padding:10px;color:#fff;box-shadow:var(--shadow);width:100%;max-width:400px}
.codecard.green{--dc:var(--green)}
.cc-title{font-family:var(--title);text-align:center;font-size:20px;margin-bottom:6px;letter-spacing:2px}
.cc-title small{font-family:var(--ui);font-size:13px;letter-spacing:0;opacity:.85}
.ctab{display:grid;grid-template-columns:26px repeat(8,1fr);gap:3px}
.ctab div{background:#fff;color:var(--ink);border-radius:6px;font-size:13px;text-align:center;padding:4px 0;line-height:1.1}
.ctab .hd{background:transparent;display:grid;place-items:center;padding:1px 0;border-radius:6px}
.ctab .hd.on{background:rgba(255,255,255,.35)}
.ctab .hl{background:#fff1b8}
.ctab .hit{background:var(--yellow);outline:3px solid var(--ink);font-weight:bold;position:relative;z-index:1}
.secretline{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px;margin-top:8px;text-align:center;font-size:15px}
.secretline .sw{font-size:22px;color:#d9480f}

/* chameleon card */
.chamcard{background:linear-gradient(135deg,#ff5a4e,#ffc928,#6ee06a,#22c3b0,#2f7fe0,#8b5cf6);border:4px solid var(--ink);border-radius:18px;padding:14px;text-align:center;color:#fff;box-shadow:var(--shadow);width:100%;max-width:400px}
.chamcard h2{font-family:var(--title);font-size:30px;margin:4px 0;text-shadow:0 3px 0 var(--ink)}
.chamcard p{background:rgba(31,36,51,.75);border-radius:12px;padding:8px;font-size:15px}
.cardback{--dc:var(--blue);width:100%;max-width:400px;min-height:210px;border:4px solid var(--ink);border-radius:18px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.18) 0 18%,transparent 19%) 0 0/44px 44px,var(--dc);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.cardback.green{--dc:var(--green)}
.cardback .cb-in{background:rgba(255,255,255,.18);border:3px dashed rgba(255,255,255,.7);border-radius:50%;width:150px;height:150px;display:grid;place-items:center;color:#fff}
.cardback svg{filter:brightness(0) invert(1)}
.mycard{width:100%;display:flex;flex-direction:column;align-items:center}
.mycard .label{color:#fff;margin-bottom:6px}
.flip{width:100%;display:flex;justify-content:center;cursor:pointer}
.flip.open>*{animation:flipIn .45s}

/* phase widgets */
.callout{background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:12px;text-align:center;font-size:19px;margin:10px 0}
.order{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:5px}
.order li{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border:3px solid #d8d0bd;border-radius:12px;background:#fff}
.order li.done{border-color:var(--ink)}
.order li.now{border-color:var(--ink);background:#fff1b8;animation:pulseb 1.2s infinite}
@keyframes pulseb{50%{background:#ffe07a}}
.order li b{font-weight:normal;color:#d9480f}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0}
.vrow{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 8px;margin-bottom:6px}
.vrow span{flex:1}
.vrow b{min-width:28px;text-align:center;font-size:22px}
.timer{font-family:var(--title);font-size:48px;text-align:center;color:var(--ink)}
.timer.end{color:var(--red)}
.clues{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.clues span{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:15px}
.banner{text-align:center;font-family:var(--title);font-size:34px;margin:4px 0 8px}
.banner.win{color:var(--green)} .banner.lose{color:var(--red)}
.reveal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.mini{width:120px;height:160px;border:4px solid var(--ink);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:flipIn .6s;padding:6px}
.mini.blue{background:var(--blue)} .mini.green{background:var(--green)}
.mini.cham{background:linear-gradient(135deg,#ff5a4e,#ffc928,#6ee06a,#2f7fe0,#8b5cf6)}
.mini b{font-size:16px;text-shadow:0 2px 0 var(--ink)}
.trophy{text-align:center;background:linear-gradient(#fff1b8,#ffc928);border:4px solid var(--ink);border-radius:18px;padding:12px;margin:10px 0}
.trophy .t1{font-family:var(--title);font-size:30px}
.vlist{font-size:14px;color:#555;text-align:center;margin:6px 0}

/* modal / toast */
/* ---------- 온라인: 접속 점 · 채팅 · 안내 (노터치 크라켄 구조) ---------- */
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:#9aa0ad;border:1.5px solid var(--ink);transition:background .3s}
.pdot.good{background:#3fc26b}.pdot.mid{background:#f2c230}.pdot.bad{background:#ff8a2a}.pdot.stale{background:#e0483e}.pdot.off{background:#9aa0ad}
.chatbox{max-height:220px;min-height:70px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px 8px;background:#fff;border:3px solid var(--ink);border-radius:14px;margin-top:6px}
.chat-sheet .chatbox{max-height:46vh;min-height:160px}
.cmsg{font-size:15px;line-height:1.4;max-width:86%;align-self:flex-start;background:#eef3ff;padding:6px 10px;border-radius:12px;margin:0 6px;word-break:break-all}
.cmsg.mine{align-self:flex-end;background:#fff1b8}
.cmsg .cn{font-size:12px;color:#6b7080;display:block}
.chat-empty{font-size:14px;color:#8a8f9c;text-align:center;padding:16px 0}
.chatform{display:flex;gap:8px;align-items:center;margin-top:8px}
.chatform input{flex:1;padding:9px 10px;font-size:16px}
.chatform button{flex:0 0 auto}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.qchip{font-size:14px;padding:5px 10px;border-radius:999px;background:#fff;border:2px solid var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.chat-tip{display:none;font-size:14px;color:#b3261e;background:#ffe3df;border-radius:8px;padding:6px 10px;margin:6px 0 0}
.chat-tip.on{display:block}
.chatbtn{position:relative}
.cbadge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:19px;padding:0 5px;border:2px solid var(--ink)}
#chatSheet{position:fixed;inset:0;background:rgba(10,20,18,.6);display:none;align-items:flex-end;justify-content:center;z-index:45}
#chatSheet.on{display:flex}
.chat-sheet{background:var(--paper);border:4px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 16px 18px;width:100%;max-width:560px;box-shadow:var(--shadow)}
#bubbleLayer{position:fixed;inset:0;pointer-events:none;z-index:40}
.bubble{position:absolute;transform:translate(-50%,-100%);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;color:var(--ink);border:3px solid var(--ink);font-size:14px;padding:5px 10px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:opacity .5s;animation:pop .3s}
.bubble::after{content:'';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bubble.out{opacity:0}
#connbar{position:fixed;left:0;right:0;top:0;z-index:70;display:none;text-align:center;font-size:14px;padding:8px;background:var(--red);color:#fff}
#connbar.on{display:block}
.stalebar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#ffe3df;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:15px}
.stalebar button{flex:0 0 auto}
.resume{background:#fff1b8;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin:10px 0}
.resume p{margin:0 0 8px}
.linkbtn{background:none;box-shadow:none;color:#6b7080;text-decoration:underline;font-size:14px;padding:6px;display:block;margin:12px auto 0}
.diag{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed #d8d0bd;text-align:left}
.dmark{width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:#9aa0ad}
.dmark.ok{background:#3fc26b}.dmark.no{background:var(--red)}.dmark.wait{background:#f2c230}
.modal-in code{display:block;background:#1f2433;color:#ffe89a;padding:9px;border-radius:8px;margin:6px 0;font-size:12px;text-align:left}
.modal-in ol,.modal-in ul{text-align:left;padding-left:20px;line-height:1.6}
/* 가독성: 본문·카드 단어는 Pretendard, 버튼·소제목만 주아체 */
button,h2,h3,.chip,.deckbadge,.tag,.roomcode,.mini,.qchip{font-family:var(--fun)}
b,strong{font-weight:700}
p,li,label,.muted,.callout,.opt,.vlist,.secretline,.cmsg,.order li,.chat-empty{font-family:var(--ui);letter-spacing:-.01em}
.cell{font-family:var(--ui);font-weight:600;letter-spacing:-.02em}
.ctab div{font-family:var(--ui);font-weight:600}
.callout{font-weight:600}
.modal-in.rules li,.modal-in.rules p{font-size:15.5px;line-height:1.65}
#modal{position:fixed;inset:0;background:rgba(10,20,18,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;overflow:auto}
#modal.show{display:flex}
.modal-in{background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:18px;max-width:460px;width:100%;box-shadow:var(--shadow);text-align:center;max-height:92vh;overflow:auto}
.modal-in.wide{max-width:560px}
.modal-in.rules{text-align:left}
.modal-in.rules li{margin-bottom:6px;line-height:1.5}
.cugrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}
.cugrid input{padding:8px 4px;font-size:14px;text-align:center;border-width:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
@media (max-width:560px){
  .tcol,.side{flex-basis:100%}
  .panel{padding:14px}
  .cell{min-height:50px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" onclick="if(event.target===this&&!this.dataset.lock)App.closeModal()"></div>
<div id="toast"></div>
<div id="connbar">연결이 끊겼어요. 다시 연결하는 중…</div>
<div id="bubbleLayer"></div>
<div id="chatSheet" onclick="if(event.target===this)App.closeChat()">
  <div class="chat-sheet">
    <div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1;margin:0">💬 채팅</h3><button class="ghostdark sm" onclick="App.closeChat()">닫기</button></div>
    <div class="chatbox" id="chatList"></div>

   48칸에 16개 좌표가 정확히 3번씩 — 파랑 덱/초록 덱은 서로 다른 배치 */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeCodeTable(seed){
  const coords=[];for(let r=1;r<=4;r++)for(const c of COLS)coords.push(c+r);
  const pool=[...coords,...coords,...coords];const rnd=mulberry32(seed);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const t=[];for(let y=0;y<6;y++)t.push(pool.slice(y*8,y*8+8));return t;
}
const CODE={blue:makeCodeTable(1717),green:makeCodeTable(4242)};

/* ================= 유틸 ================= */
const rint=n=>Math.floor(Math.random()*n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const same=(a,b)=>{const f=s=>String(s||'').replace(/\s+/g,'').toLowerCase();return f(a)===f(b)};
function toArr(x){if(!x)return[];if(Array.isArray(x))return x.filter(v=>v!==null&&v!==undefined);return Object.keys(x).sort((a,b)=>a-b).map(k=>x[k])}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const nowMs=()=>Date.now()+(typeof srvOffset!=='undefined'?srvOffset:0);
function getPid(){let p=null;try{p=sessionStorage.getItem('cham_pid')}catch(e){}if(!p){p='u'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('cham_pid',p)}catch(e){}}return p}
function customOk(c){return !!(c&&c.name&&String(c.name).trim()&&c.words&&toArr(c.words).length===16&&toArr(c.words).every(w=>String(w).trim()))}

/* ================= 게임 로직 (로컬/온라인 공통 리듀서) ================= */
function norm(G){
  if(!G)return G;
  G.players=G.players||{};G.order=toArr(G.order);G.clues=toArr(G.clues);G.votes=G.votes||{};G.ready=G.ready||{};
  G.used=G.used||{};G.guesses=toArr(G.guesses);G.tied=toArr(G.tied);G.winners=toArr(G.winners);
  G.settings=Object.assign({target:5,hideBig:true,two3:true,custom:null,level:2},G.settings||{});
  if(G.settings.custom)G.settings.custom.words=toArr(G.settings.custom.words);
  return G;
}
function getTopic(G){return G.topic===-1?G.settings.custom:TOPICS[G.topic]}
function secretOf(G){
  const coord=CODE[G.deck][G.dice.y-1][G.dice.b-1];
  const idx=(+coord[1]-1)*4+COLS.indexOf(coord[0]);
  return {coord,idx,word:getTopic(G).words[idx]};
}
function speakers(G){const i=Math.max(0,G.order.indexOf(G.dealer));return G.order.slice(i).concat(G.order.slice(0,i))}
function isHidden(G){return G.order.length>=7&&G.settings.hideBig&&['debate','vote','tiebreak','guess'].includes(G.phase)}
function newRound(G,dealer){
  G.dealer=dealer;
  // 코드 카드 덱 + 카멜레온 카드 1장을 섞어 한 장씩 → 한 명이 카멜레온
  G.chameleon=G.order[rint(G.order.length)];
  G.topic=null;G.dice=null;G.clues=[];G.turn=0;G.votes={};G.ready={};G.tied=[];G.voteTally=null;
  G.accused=null;G.guesses=[];G.guessesLeft=0;G.result=null;G.debateAt=null;G.phase='setup';
}
function finish(G,type,delta){
  G.result={type,delta};G.phase='result';
  const top=Math.max(...G.order.map(p=>G.players[p].score));
  if(top>=G.settings.target){G.over=true;G.winners=G.order.filter(p=>G.players[p].score===top)}
}
function accuse(G,t){
  G.accused=t;
  if(t!==G.chameleon){ // 코드 카드 → 카멜레온 탈출
    G.players[G.chameleon].score+=2;finish(G,'escaped',{[G.chameleon]:2});
  }else{ // 카멜레온 카드 → 비밀 단어 맞히기 기회
    G.phase='guess';G.guesses=[];
    G.guessesLeft=(G.order.length===3&&G.settings.two3)?2:1;
  }
}
function tally(G,c){
  const vals=G.order.map(p=>c[p]||0);const max=Math.max(...vals);
  if(max<=0)throw '투표 결과가 없어요';
  G.voteTally=c;
  const tied=G.order.filter(p=>(c[p]||0)===max);
  if(tied.length===1)accuse(G,tied[0]);
  else{G.tied=tied;G.phase='tiebreak'} // 동률 → 진행자가 결정표
}
function reduce(G0,a){
  const G=norm(JSON.parse(JSON.stringify(G0)));
  const n=G.order.length;
  const need=(c,m)=>{if(!c)throw m||'지금은 할 수 없어요'};
  switch(a.t){
    case 'join':{
      const ex=G.players[a.pid]&&G.players[a.pid].name;
      need(ex||G.phase==='lobby','이미 게임이 시작된 방이에요');
      need(ex||Object.values(G.players).filter(p=>p.name).length<8,'방이 가득 찼어요 (최대 8명)');
      const old=G.players[a.pid]||{};
      G.players[a.pid]=Object.assign(old,{name:a.name,joined:old.joined||Date.now(),score:old.score||0});
      break;}
    case 'kick':{
      need(G.phase==='lobby');delete G.players[a.pid];
      const rest=Object.keys(G.players).filter(k=>G.players[k].name);
      if(!rest.length)return null;
      if(G.host===a.pid)G.host=rest[0];
      break;}
    case 'settings':Object.assign(G.settings,a.s);break;
    case 'start':{
      need(G.phase==='lobby');
      if(a.players){G.players={};a.players.forEach((p,i)=>G.players[p.id]={name:p.name,joined:i,score:0})}
      Object.keys(G.players).forEach(k=>{if(!G.players[k].name)delete G.players[k]});
      const ids=Object.keys(G.players).sort((x,y)=>G.players[x].joined-G.players[y].joined);
      need(ids.length>=3&&ids.length<=8,'3~8명이 필요해요');
      ids.forEach(id=>G.players[id].score=0);
      G.order=ids;G.round=1;G.deck='blue';G.over=false;G.winners=[];G.used={};G.rollId=G.rollId||0;
      newRound(G,ids[rint(ids.length)]);break;}
    case 'topic':{
      need(G.phase==='setup');let idx=a.idx;
      if(idx==='rand'){const lv=G.settings.level;const all=TOPICS.map((_,i)=>i).filter(i=>inLevel(i,lv));let pool=all.filter(i=>!G.used[i]&&i!==G.topic);if(!pool.length){all.forEach(i=>delete G.used[i]);pool=all.filter(i=>i!==G.topic);if(!pool.length)pool=all}idx=pool[rint(pool.length)]}
      idx=+idx;
      if(idx===-1)need(customOk(G.settings.custom),'나만의 토픽 카드를 먼저 채워 주세요');
      G.topic=idx;if(idx>=0)G.used[idx]=true;break;}
    case 'roll':
      need(G.phase==='setup'&&G.topic!=null,'토픽 카드를 먼저 뒤집어 주세요');
      G.dice={y:1+rint(6),b:1+rint(8)};G.rollId=(G.rollId||0)+1;G.phase='check';G.ready={};break;
    case 'ready':G.ready[a.pid]=true;break;
    case 'startClues':need(G.phase==='check');G.phase='clues';G.turn=0;G.clues=[];break;
    case 'clue':{
      need(G.phase==='clues');need(speakers(G)[G.turn]===a.pid,'아직 차례가 아니에요');
      G.clues.push({pid:a.pid,word:String(a.word||'').slice(0,24)});G.turn++;
      if(G.turn>=n){G.phase='debate';G.debateAt=nowMs()}
      break;}
    case 'startVote':need(G.phase==='debate');G.phase='vote';G.votes={};break;
    case 'vote':{
      need(G.phase==='vote');need(a.target!==a.pid,'자기 자신은 지목할 수 없어요');
      G.votes[a.pid]=a.target;
      const vs=G.order.filter(p=>G.votes[p]);
      if(vs.length>=n){const c={};vs.forEach(p=>c[G.votes[p]]=(c[G.votes[p]]||0)+1);tally(G,c)}
      break;}
    case 'localVote':need(G.phase==='vote');tally(G,a.counts);break;
    case 'tiebreak':need(G.phase==='tiebreak'&&G.tied.includes(a.target));accuse(G,a.target);break;
    case 'guess':{
      need(G.phase==='guess');const sec=secretOf(G);G.guesses.push(a.word);
      if(same(a.word,sec.word)){G.players[G.chameleon].score+=1;finish(G,'caught-guessed',{[G.chameleon]:1})}
      else{G.guessesLeft--;if(G.guessesLeft<=0){const d={};G.order.forEach(p=>{if(p!==G.chameleon){G.players[p].score+=2;d[p]=2}});finish(G,'caught',d)}}
      break;}
    case 'next': // 이번 카멜레온이 다음 진행자, 덱 교체
      need(G.phase==='result'&&!G.over);G.round++;G.deck=G.deck==='blue'?'green':'blue';newRound(G,G.chameleon);break;
    case 'toLobby':
      G.phase='lobby';G.order=[];G.over=false;G.winners=[];G.result=null;G.topic=null;G.dice=null;G.dealer=null;G.chameleon=null;
      Object.values(G.players).forEach(p=>p.score=0);break;
  }
  return G;
}

const S={screen:'home',mode:null,G:null,me:getPid(),name:lsGet('cham_name')||'',code:null,ref:null,takeover:null,presLoaded:false,
  peek:false,peekKey:null,shownRoll:null,vc:{},vcKey:null,prefill:'',
  localNames:['','','',''],localSettings:{target:5,hideBig:true,two3:true,custom:null,level:2}};
const PRES_PATH=ROOT+'/pres', CHAT_PATH=ROOT+'/chat';
const STALE_MS=7000, PING_MS=2500, TAKEOVER_MS=20000, ROOM_KEY='cham_room';
let db=null, fbFail=null, srvOffset=0, selfOffline=false, connWatched=false, PRES={}, pingTimer=null, presTimer=null;
const serverNow=()=>Date.now()+srvOffset;
const TS=()=>firebase.database.ServerValue.TIMESTAMP;
const newUid=()=>'u'+Math.random().toString(36).slice(2,10);
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function setPid(v){S.me=v;try{sessionStorage.setItem('cham_pid',v)}catch(e){}}

function fbInit(){
  if(db)return true;
  if(!FB_READY){fbFail='config';return false}
  if(typeof firebase==='undefined'){fbFail='network';return false}
  try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();fbFail=null;return true}
  catch(e){console.error('[카멜레온] Firebase 초기화 실패',e);fbFail='network';return false}
}
const RULES_CODE=`<code>{ "rules": { ".read": true, ".write": true } }</code>`;
function fbErrMsg(e){
  const m=String((e&&e.message)||e||'');
  if(/permission[_ ]?denied/i.test(m))return '데이터베이스 규칙에서 막혔어요';
  if(/network|offline|unavailable|failed to fetch/i.test(m))return '서버에 연결할 수 없어요';
  return '오류가 났어요';
}
function showFbError(e){
  console.error('[카멜레온]',e);
  const m=String((e&&e.message)||e||''),denied=/permission[_ ]?denied/i.test(m);
  showModal(`<div class="modal-in"><h2>${denied?'권한이 없어요':'연결 문제'}</h2>
    ${denied?`<p>Firebase 데이터베이스가 읽기·쓰기를 거부했어요. 규칙을 열어 주면 해결돼요.</p>
      <ol><li>Firebase 콘솔 → 빌드 → Realtime Database</li><li>규칙 탭을 아래로 바꾸고 게시${RULES_CODE}</li><li>이 페이지 새로고침</li></ol>`
    :`<p>데이터베이스에 연결하지 못했어요.</p><ul><li>인터넷 연결 확인</li><li>Realtime Database를 만들었는지 확인 (Firestore와 달라요)</li><li>databaseURL이 맞는지 확인</li></ul>`}
    <p class="muted" style="word-break:break-all">${esc(m)}</p><button class="big" onclick="App.closeModal()">닫기</button></div>`);
}

  if(fbFail==='network')return showModal(`<div class="modal-in"><h2>서버에 연결할 수 없음</h2><p>Firebase 라이브러리를 불러오지 못했어요.</p>
    <ul><li>인터넷 연결이 끊겨 있음</li><li>학교·기관 네트워크에서 gstatic.com이 차단됨</li><li>파일을 더블클릭으로 연 경우(file://) — https 주소로 접속해야 해요</li></ul>

    <li>프로젝트 설정 → 내 앱 → 웹에서 firebaseConfig 복사</li><li>이 HTML 파일의 FIREBASE_CONFIG 블록에 붙여넣기</li></ol>
    <button class="big" onclick="App.closeModal()">닫기</button></div>`);

async function runDiag(){
  const line=(ok,t)=>`<div class="diag"><span class="dmark ${ok===null?'wait':ok?'ok':'no'}"></span><span>${t}</span></div>`;
  const box=b=>showModal(`<div class="modal-in"><h2>서버 연결 확인</h2>${b}</div>`);
  const close=`<button class="big" onclick="App.closeModal()">닫기</button>`;
  let html=line(typeof firebase!=='undefined','Firebase 라이브러리 불러오기');
  if(typeof firebase==='undefined')return box(html+`<p class="muted">gstatic.com 접속이 막혀 있거나 인터넷이 끊겼어요.</p>`+close);

  if(!ok)return box(html+`<p class="muted">파일의 FIREBASE_CONFIG를 확인해 주세요.</p>`+close);
  box(html+line(null,'데이터베이스 읽기·쓰기 확인 중'));
  let rw=false,msg='';
  try{const t=db.ref(ROOT+'/__diag__/'+S.me);await t.set({at:TS()});await t.get();await t.remove();rw=true}catch(e){msg=String((e&&e.message)||e)}
  html+=line(rw,'데이터베이스 읽기·쓰기');
  box(html+`<p class="muted">${rw?'모두 정상이에요.':'여기서 막혔어요. 대부분 데이터베이스 규칙 문제예요.'}</p>${rw?'':RULES_CODE+`<p class="muted" style="word-break:break-all">${esc(msg)}</p>`}`+close);
}

function clean(x){return x==null?null:JSON.parse(JSON.stringify(x))}
function dispatch(a){
  if(S.mode==='local'){
    try{S.G=reduce(S.G,a)}catch(e){toast(typeof e==='string'?e:e.message)}
    render();return;
  }
  if(!S.ref)return;
  let err=null;
  S.ref.transaction(cur=>{
    if(cur===null)return cur;
    try{err=null;return clean(reduce(cur,a))}catch(e){err=e;return}
  },(e)=>{if(e)toast(fbErrMsg(e));else if(err)toast(typeof err==='string'?err:err.message)});
}
function genCode(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=L[rint(L.length)];return s}

/* ---------- 방 입장·구독 ---------- */
function enterRoom(code){
  S.code=code;S.mode='online';S.screen='game';S.takeover=null;S.presLoaded=false;
  S.ref=db.ref(ROOT+'/'+code);
  const o=S.ref.child('players/'+S.me+'/online');o.onDisconnect().set(false);o.set(true);
  try{history.replaceState(null,'','?room='+code)}catch(e){}
  lsSet(ROOM_KEY,JSON.stringify({code,id:S.me,t:Date.now()}));
  watchConnection();startPresence(code);startChat(code);
  let first=true;
  S.ref.on('value',snap=>{
    const v=snap.val();
    if(!v){toast('방이 사라졌어요');lsDel(ROOM_KEY);return leaveRoom()}
    S.G=norm(v);
    if(first){S.shownRoll=S.G.rollId;first=false}
    if(!S.G.players[S.me]||!S.G.players[S.me].name){toast('방에서 나왔어요');lsDel(ROOM_KEY);return leaveRoom()}
    if(S.takeover&&staleActor()!==S.takeover)S.takeover=null;
    maybeMoveHost();render();
  });
}
function leaveRoom(){
  try{if(S.ref){S.ref.off();try{S.ref.child('players/'+S.me+'/online').onDisconnect().cancel()}catch(e){}}}catch(e){}
  stopChat();stopPresence();
  if(S.code&&db){try{const pr=db.ref(`${PRES_PATH}/${S.code}/${S.me}`);pr.onDisconnect().cancel();pr.remove()}catch(e){}}
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  S.ref=null;S.G=null;S.mode=null;S.code=null;S.takeover=null;S.screen='home';
  closeChat();closeModal();document.getElementById('connbar').classList.remove('on');render();
}
function namedIds(G){return Object.keys(G.players).filter(k=>G.players[k].name).sort((a,b)=>G.players[a].joined-G.players[b].joined)}
/* 대기실: 자리를 비우고, 마지막 한 명이면 방을 지움.
   게임 중: 자리는 남겨 둠 → 같은 방 코드나 '돌아가기'로 이어서. 그동안 차례가 오면 다른 사람이 '대신 진행'. */
async function doLeave(){
  const G=S.G;
  if(!S.code||!G){lsDel(ROOM_KEY);return leaveRoom()}
  const others=namedIds(G).filter(p=>p!==S.me),code=S.code;
  try{
    if(!others.length){await S.ref.remove();db.ref(`${PRES_PATH}/${code}`).remove();db.ref(`${CHAT_PATH}/${code}`).remove()}
    else if(G.phase==='lobby'){const patch={['players/'+S.me]:null};if(G.host===S.me)patch.host=others[0];await S.ref.update(patch)}
    else{const patch={['players/'+S.me+'/online']:false};if(G.host===S.me)patch.host=others.find(p=>!isStale(p))||others[0];await S.ref.update(patch)}
  }catch(e){console.error(e)}
  lsDel(ROOM_KEY);leaveRoom();
}
function savedRoom(){
  try{const v=JSON.parse(lsGet(ROOM_KEY)||'null');if(!v||!v.code||!v.id)return null;
    if(Date.now()-(v.t||0)>6*3600*1000){lsDel(ROOM_KEY);return null}return v}catch(e){return null}
}

/* ---------- 접속 감시 ---------- */
function watchConnection(){
  if(connWatched||!db)return;connWatched=true;
  db.ref('.info/serverTimeOffset').on('value',s=>{srvOffset=s.val()||0});
  db.ref('.info/connected').on('value',s=>{
    selfOffline=s.val()!==true;
    if(!selfOffline&&S.code){
      const pr=db.ref(`${PRES_PATH}/${S.code}/${S.me}`);pr.onDisconnect().update({connected:false});pr.update({connected:true,lastSeen:TS()});
      const o=db.ref(`${ROOT}/${S.code}/players/${S.me}/online`);o.onDisconnect().set(false);o.set(true);
    }
    document.getElementById('connbar').classList.toggle('on',!!S.code&&selfOffline);
  });
}
function startPresence(code){
  const r=db.ref(`${PRES_PATH}/${code}/${S.me}`);
  r.set({connected:true,lastSeen:TS(),pingMs:null});r.onDisconnect().update({connected:false});
  db.ref(`${PRES_PATH}/${code}`).on('value',s=>{PRES=s.val()||{};S.presLoaded=true;paintPresence()});
  clearInterval(pingTimer);
  pingTimer=setInterval(()=>{if(!S.code)return;const t0=Date.now();r.update({lastSeen:TS()}).then(()=>r.update({pingMs:Date.now()-t0,connected:true})).catch(()=>{})},PING_MS);
  clearInterval(presTimer);
  presTimer=setInterval(()=>{
    paintPresence();maybeMoveHost();
    const st=staleActor();
    if(S.takeover&&st!==S.takeover)S.takeover=null;
    if(st!==S.lastStale){S.lastStale=st;if(S.screen==='game'&&S.G)render()}
  },1000);
}
function stopPresence(){
  clearInterval(pingTimer);pingTimer=null;clearInterval(presTimer);presTimer=null;
  if(S.code&&db)try{db.ref(`${PRES_PATH}/${S.code}`).off()}catch(e){}
  PRES={};S.presLoaded=false;
}
function isStale(u){
  const m=PRES[u];if(!m)return true;
  if(m.connected===false)return true;
  return !!(m.lastSeen&&serverNow()-m.lastSeen>STALE_MS);
}
function presCls(u){
  const m=PRES[u];if(!m)return 'off';
  if(isStale(u))return 'stale';
  return m.pingMs==null?'mid':(m.pingMs<150?'good':m.pingMs<400?'mid':'bad');
}
function pdot(p){return S.mode==='online'?`<span class="pdot ${presCls(p)}" data-pid="${p}"></span>`:''}
function paintPresence(){document.querySelectorAll('.pdot[data-pid]').forEach(el=>{el.className='pdot '+presCls(el.dataset.pid)})}
function maybeMoveHost(){
  const G=S.G;if(!G||!S.code||!S.presLoaded)return;
  const host=G.host;if(host===S.me)return;
  const h=PRES[host];
  if(h&&h.lastSeen&&serverNow()-h.lastSeen<TAKEOVER_MS&&h.connected!==false)return;
  if(!h&&G.players[host])return; // 아직 접속 정보가 안 들어옴
  const alive=namedIds(G).filter(u=>!isStale(u));
  if(alive.length&&alive[0]===S.me)S.ref.child('host').transaction(cur=>cur===host?S.me:undefined);
}
/* 지금 누구를 기다리는지 → 그 사람이 끊겼으면 '대신 진행' */
function waitingOn(G){
  switch(G.phase){
    case 'setup':case 'check':case 'debate':case 'tiebreak':return [G.dealer];
    case 'clues':return [speakers(G)[G.turn]];
    case 'vote':return G.order.filter(p=>!G.votes[p]);
    case 'guess':return [G.chameleon];
  }
  return [];
}
function staleActor(){
  const G=S.G;if(!G||S.mode!=='online'||G.phase==='lobby'||!S.presLoaded)return null;
  return waitingOn(G).find(p=>p!==S.me&&isStale(p))||null;
}
const ME=()=>S.takeover||S.me; // 대신 진행 중이면 그 사람으로 행동

let CHAT=[],CHAT_OPEN=false,CHAT_UNREAD=0,CHAT_LAST=0,CHAT_SENT_AT=0,CHAT_LAST_TEXT='',CHAT_REF=null;
const QUICK=['너 카멜레온이지?','난 아니야!','그 단어 수상해','너무 뻔했어','날 믿어 줘','투표하자','ㅋㅋㅋ'];
const BAD_WORDS=["시발","씨발","씨팔","시팔","ㅅㅂ","개새끼","개색기","새꺄","병신","ㅂㅅ","좆","좇","존나","존내","걸레","창녀","미친놈","미친년","지랄","닥쳐","꺼져","뒤져","죽어라","한남충","한녀충","틀딱","급식충","맘충","fuck","fucking","shit","bitch","asshole","bastard","nigger","retard"];
const CHAT_MAX=100,CHAT_COOL=1200,CHAT_DUP=15000;
function startChat(code){
  CHAT=[];CHAT_UNREAD=0;CHAT_LAST=0;
  CHAT_REF=db.ref(`${CHAT_PATH}/${code}`).limitToLast(40);
  CHAT_REF.on('value',s=>{
    const v=s.val()||{};
    const list=Object.entries(v).map(([k,m])=>({k,...m})).sort((a,b)=>(a.t||0)-(b.t||0)||(a.k<b.k?-1:1));
    const fresh=list.filter(m=>(m.t||0)>CHAT_LAST&&CHAT.every(c=>c.k!==m.k));
    const first=CHAT.length===0&&CHAT_LAST===0;
    CHAT=list;if(list.length)CHAT_LAST=Math.max(CHAT_LAST,...list.map(m=>m.t||0));
    if(!first)fresh.forEach(m=>{if(m.uid!==S.me&&!CHAT_OPEN)CHAT_UNREAD++;showBubble(m)});
    renderChat();
  });
}
function stopChat(){try{if(CHAT_REF)CHAT_REF.off()}catch(e){}CHAT_REF=null;CHAT=[];CHAT_UNREAD=0}
function squash(t){return t.replace(/(.)\1{7,}/g,(m,c)=>c.repeat(8))}
function maskBad(text){
  const skip=/[\s.,!?~^*\-_'"]/;let plain='';const map=[];
  for(let i=0;i<text.length;i++){if(!skip.test(text[i])){plain+=text[i];map.push(i)}}
  const low=plain.toLowerCase(),chars=text.split('');let hit=false;
  for(const w0 of BAD_WORDS){const w=w0.toLowerCase();let from=0,pos;
    while((pos=low.indexOf(w,from))!==-1){hit=true;for(let k=0;k<w.length;k++)chars[map[pos+k]]='*';from=pos+w.length}}
  return {text:chars.join(''),hit};
}
function onlyJamo(t){const x=t.replace(/\s+/g,'');if(!x||/^[ㅋㅎ]+$/.test(x))return false;return /^[ㄱ-ㅎ]+$/.test(x)}
/* 카멜레온 전용: 비밀 단어를 아는 사람이 채팅에 비밀 단어를 쓰면 막음 */
function leaksSecret(text){
  const G=S.G;
  if(!G||!G.dice||G.topic==null||!['check','clues','debate','vote','tiebreak','guess'].includes(G.phase)||S.me===G.chameleon)return false;
  const w=String(secretOf(G).word||'').replace(/\s+/g,'').toLowerCase();
  return !!w&&text.replace(/\s+/g,'').toLowerCase().includes(w);
}
function chatTip(m){
  ['chatTip','lobbyChatTip'].forEach(id=>{const t=document.getElementById(id);if(!t)return;t.textContent=m;t.classList.add('on');
    clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2000)});
}
function sendChat(text){
  text=String(text||'').replace(/\s+/g,' ').trim();
  if(!text||!S.code||!db)return false;
  if(onlyJamo(text)){chatTip('초성만으로는 보낼 수 없어요');return false}
  if(leaksSecret(text)){chatTip('비밀 단어는 채팅에 쓸 수 없어요 🤫');return false}
  const now=Date.now();
  if(now-CHAT_SENT_AT<CHAT_COOL){chatTip('너무 빨라요. 잠시 후에 보내세요');return false}
  text=squash(text).slice(0,CHAT_MAX);
  const {text:masked,hit}=maskBad(text);text=masked;
  if(text===CHAT_LAST_TEXT&&now-CHAT_SENT_AT<CHAT_DUP){chatTip('같은 메시지는 잠시 뒤에 보낼 수 있어요');return false}
  CHAT_SENT_AT=now;CHAT_LAST_TEXT=text;
  if(hit)chatTip('거친 표현은 별표로 가렸어요');
  const nmv=(S.G&&S.G.players[S.me]&&S.G.players[S.me].name)||'손님';
  db.ref(`${CHAT_PATH}/${S.code}`).push({uid:S.me,name:nmv,text,t:TS()}).catch(e=>toast(fbErrMsg(e)));
  return true;
}
function chatHTML(){
  if(!CHAT.length)return `<div class="chat-empty">아직 대화가 없어요</div>`;
  return CHAT.map(m=>`<div class="cmsg ${m.uid===S.me?'mine':''}"><span class="cn">${esc(m.name||'')}</span>${esc(maskBad(String(m.text||'')).text)}</div>`).join('');
}
function renderChat(){
  const h=chatHTML();
  ['chatList','lobbyChat'].forEach(id=>{const b=document.getElementById(id);if(b){b.innerHTML=h;b.scrollTop=b.scrollHeight}});
  const b=document.getElementById('chatBadge');if(b){b.textContent=CHAT_UNREAD>9?'9+':CHAT_UNREAD;b.style.display=CHAT_UNREAD?'':'none'}
}
function openChat(){
  CHAT_OPEN=true;CHAT_UNREAD=0;
  document.getElementById('chatQuick').innerHTML=QUICK.map((q,i)=>`<button class="qchip" onclick="App.quick(${i})">${esc(q)}</button>`).join('');
  document.getElementById('chatSheet').classList.add('on');renderChat();
}
function closeChat(){CHAT_OPEN=false;const s=document.getElementById('chatSheet');if(s)s.classList.remove('on')}
/* 점수판의 그 사람 이름표 위에 말풍선 */
function showBubble(m){
  if(S.screen!=='game'||!S.G||S.G.phase==='lobby')return;
  const chip=document.querySelector(`.chip[data-pid="${m.uid}"]`);if(!chip)return;
  const r=chip.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
  const el=document.createElement('div');el.className='bubble';
  el.innerHTML=`<b>${esc(m.name||'')}</b> ${esc(maskBad(String(m.text||'')).text)}`;
  el.style.left=Math.min(innerWidth-70,Math.max(70,r.left+r.width/2))+'px';
  el.style.top=Math.max(40,r.top-4)+'px';
  document.getElementById('bubbleLayer').appendChild(el);
  setTimeout(()=>el.classList.add('out'),3600);setTimeout(()=>el.remove(),4200);
}

const PIP={tl:[27,27],tr:[73,27],ml:[27,50],mr:[73,50],c:[50,50],bl:[27,73],br:[73,73]};
const FACE={1:['c'],2:['tl','br'],3:['tl','c','br'],4:['tl','tr','bl','br'],5:['tl','tr','c','bl','br'],6:['tl','tr','ml','mr','bl','br']};
function d6SVG(v,s=64){
  const pips=(FACE[v]||[]).map(k=>`<circle cx="${PIP[k][0]}" cy="${PIP[k][1]}" r="${s<30?11:9}" fill="#1f2433"/>`).join('');
  return `<svg viewBox="0 0 100 100" width="${s}" height="${s}"><rect x="6" y="6" width="88" height="88" rx="20" fill="#ffc928" stroke="#1f2433" stroke-width="${s<30?9:6}"/>${pips}${v?'':'<text x="50" y="66" text-anchor="middle" font-size="46" fill="#1f2433" font-family="Do Hyeon, Jua, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="bold">?</text>'}</svg>`;
}
function d8SVG(v,s=64){
  const small=s<30;
  return `<svg viewBox="0 0 100 100" width="${s}" height="${s}"><polygon points="50,4 95,50 50,96 5,50" fill="#1d5fb8" stroke="#1f2433" stroke-width="${small?8:6}" stroke-linejoin="round"/>${small?'':'<polygon points="50,10 84,62 16,62" fill="#2f7fe0" stroke="#1f2433" stroke-width="3" stroke-linejoin="round"/>'}<text x="50" y="${small?66:52}" text-anchor="middle" font-size="${small?46:30}" fill="#fff" font-family="Do Hyeon, Jua, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="bold">${v||'?'}</text></svg>`;
}

function topicHTML(G,o={}){
  if(G.topic==null)return `<div class="topic back" style="--tc:#3c4458"><div class="tb-in"><div class="tb-title">TOPIC</div><div class="bob">${chamSVG(120)}</div><p>진행자가 토픽 카드를 뒤집어요</p></div></div>`;
  const T=getTopic(G);const col=G.topic===-1?'#4d5670':COLORS[G.topic%COLORS.length];
  if(o.hidden)return `<div class="topic back" style="--tc:${col}"><div class="tb-in"><div class="tb-title">${esc(T.name)}</div><p>토픽 카드를 뒤집어 두었어요<br><small>(7~8인 규칙)</small></p></div></div>`;
  const sec=o.reveal?secretOf(G).idx:-1;
  let h=`<div class="topic" style="--tc:${col}"><div class="topic-head"><small>TOPIC${T.lv?` · ${LV_NAME[T.lv]}`:''}</small><b>${esc(T.name)}</b></div><div class="tgrid"><div></div>`;
  for(const c of COLS)h+=`<div class="colh"><span>${c}</span></div>`;
  for(let r=0;r<4;r++){
    h+=`<div class="rowh">${r+1}</div>`;
    for(let c=0;c<4;c++){
      const i=r*4+c,w=T.words[i],wrong=o.pick&&G.guesses.some(g=>same(g,w));
      h+=`<div class="cell ${i===sec?'secret':''} ${o.pick&&!wrong?'pick':''} ${wrong?'wrong':''}" ${o.pick&&!wrong?`onclick="App.guessPick(${i})"`:''}>${esc(w)}</div>`;
    }
  }
  return h+'</div></div>';
}
function diceHTML(G){
  const y=G.dice?G.dice.y:0,b=G.dice?G.dice.b:0;
  return `<div class="tray"><div class="die"><div id="d6">${d6SVG(y,70)}</div>노랑 주사위</div><div class="die"><div id="d8">${d8SVG(b,70)}</div>파랑 주사위</div></div>`;
}
function codeCardHTML(G,withSecret){
  const T=CODE[G.deck],y=G.dice?G.dice.y:0,b=G.dice?G.dice.b:0;
  let h=`<div class="codecard ${G.deck}"><div class="cc-title">CODE CARD <small>${G.deck==='blue'?'파랑 덱':'초록 덱'}</small></div><div class="ctab"><div class="hd"></div>`;
  for(let c=1;c<=8;c++)h+=`<div class="hd ${c===b?'on':''}">${d8SVG(c,24)}</div>`;
  for(let r=1;r<=6;r++){
    h+=`<div class="hd ${r===y?'on':''}">${d6SVG(r,20)}</div>`;
    for(let c=1;c<=8;c++){const cls=r===y&&c===b?'hit':(r===y||c===b)?'hl':'';h+=`<div class="${cls}">${T[r-1][c-1]}</div>`}
  }
  h+='</div>';
  if(withSecret&&G.dice&&G.topic!=null){const s=secretOf(G);h+=`<div class="secretline">노랑 ${y} × 파랑 ${b} → <b>${s.coord}</b><br>비밀 단어 <b class="sw">${esc(s.word)}</b></div>`}
  else if(!G.dice)h+=`<div class="secretline">주사위를 굴리면 좌표가 정해져요</div>`;
  return h+'</div>';
}

    if(loc)h+=`<div class="callout"><b>${nm(cur)}</b> 님 차례! 단어 하나를 크게 말하세요.</div>
      <div class="row"><input id="lclue" maxlength="20" placeholder="(선택) 말한 단어 기록" onkeydown="if(event.key==='Enter')App.localClue()"><button style="flex:0 0 auto" onclick="App.localClue()">다음 →</button></div>`;
    else if(cur===ME())h+=`<div class="callout">${S.takeover?nm(cur)+' 님 대신 입력':'내 차례!'} 관련 단어 하나를 입력하세요.</div>

      <p style="text-align:center">합계 <b>${sum}</b> / ${n}표</p>
      <button class="big red" ${sum===0?'disabled':''} onclick="App.localVoteDone()">카드 공개!</button>`;}
    const voted=G.order.filter(p=>G.votes[p]).length;
    return `<h3>👉 ${S.takeover?nm(S.takeover)+' 님 대신 ':''}카멜레온을 지목하세요</h3><p>모두 투표하면 <b>동시에</b> 공개돼요. (${voted}/${n}명 투표)</p>
    <div class="pgrid">${G.order.filter(p=>p!==ME()).map(p=>`<button class="${G.votes[ME()]===p?'red':'ghostdark'}" onclick="App.act({t:'vote',target:'${p}'})">${G.votes[ME()]===p?'👉 ':''}${nm(p)}</button>`).join('')}</div>
    <p class="muted">모두 투표하기 전까지는 바꿀 수 있어요.</p>`;}
  case 'tiebreak':{
    const T=G.voteTally||{};
    return `<h3>⚖️ 동점!</h3><p>${G.tied.map(p=>`${nm(p)}(${T[p]}표)`).join(', ')} — 표가 같아요. <b>진행자(${d})</b>가 결정표를 행사합니다.</p>
    ${isDealer()?`<div class="pgrid">${G.tied.map(p=>`<button class="red" onclick="App.act({t:'tiebreak',target:'${p}'})">${nm(p)}</button>`).join('')}</div>`:waitMsg(`${d} 님이 결정하는 중…`)}`;}
  case 'guess':{
    const cham=G.chameleon,can=loc||ME()===cham,hid=isHidden(G);
    return `<div class="reveal"><div class="mini cham"><div class="shift">${chamSVG(90)}</div><b>카멜레온</b></div></div>
    <div class="banner lose">🦎 카멜레온 발각!</div>
    <p style="text-align:center"><b>${nm(cham)}</b> 님이 카멜레온이었어요. 하지만 아직 끝나지 않았어요 — <b>비밀 단어를 맞히면 탈출!</b></p>
    <p style="text-align:center" class="muted">남은 기회 ${G.guessesLeft}번${G.guesses.length?` · 틀린 답: ${G.guesses.map(esc).join(', ')}`:''}</p>
    ${can?(hid?`<div class="row"><input id="gIn" maxlength="20" placeholder="비밀 단어는?" onkeydown="if(event.key==='Enter')App.guessType()"><button class="green" style="flex:0 0 auto" onclick="App.guessType()">정답!</button></div>`
      :`<div class="callout">${loc?`${nm(cham)} 님이 `:''}토픽 카드에서 비밀 단어를 골라 누르세요!</div>`)
      :waitMsg(`${nm(cham)} 님이 비밀 단어를 고르는 중…`)}`;}
  case 'result':{
    const r=G.result,cham=G.chameleon,acc=G.accused,s=secretOf(G);

    if(r.type==='escaped'){title='🦎 카멜레온 탈출!';cls='lose';desc=`${nm(acc)} 님은 <b>코드 카드</b>였어요. 진짜 카멜레온은 <b>${nm(cham)}</b>! 카멜레온 +2점`}
    else if(r.type==='caught-guessed'){title='😏 잡혔지만… 탈출!';cls='lose';desc=`${nm(cham)} 님이 비밀 단어를 맞혔어요! 카멜레온 +1점`}
    else{title='🎉 카멜레온 체포!';cls='win';desc=`${nm(cham)} 님이 “${esc(G.guesses[G.guesses.length-1])}”라고 답했지만 틀렸어요. 나머지 모두 +2점`}
    const accCard=acc===cham?`<div class="mini cham"><div class="shift">${chamSVG(90)}</div><b>${nm(acc)}</b></div>`:`<div class="mini ${G.deck}"><div style="font-family:var(--title);font-size:22px">CODE</div><b>${nm(acc)}</b><small>지목됨</small></div>${`<div class="mini cham"><div class="shift">${chamSVG(90)}</div><b>${nm(cham)}</b><small>진짜 카멜레온</small></div>`}`;
    let votes='';
    if(S.mode==='online'&&Object.keys(G.votes).length)votes=`<div class="vlist">투표: ${G.order.filter(p=>G.votes[p]).map(p=>`${nm(p)}→${nm(G.votes[p])}`).join(' · ')}</div>`;
    else if(G.voteTally)votes=`<div class="vlist">득표: ${G.order.filter(p=>G.voteTally[p]).map(p=>`${nm(p)} ${G.voteTally[p]}표`).join(' · ')}</div>`;
    let btn;
    if(G.over){
      btn=`<div class="trophy"><div class="t1">🏆 ${G.winners.map(nm).join(', ')} 우승!</div><div>${G.settings.target}점 달성</div></div>${isHost()?`<button class="big green" onclick="App.restart()">🔄 새 게임</button>`:waitMsg('방장이 새 게임을 시작할 수 있어요')}`;
    }else{
      const nd=G.deck==='blue'?'초록':'파랑';
      btn=(loc||isHost()||S.me===cham||(isStale(G.host)&&isStale(cham)))?`<button class="big green" onclick="App.act({t:'next'})">다음 라운드 → (진행자: ${nm(cham)}, ${nd} 덱)</button>`:waitMsg(`다음 라운드는 이번 카멜레온 ${nm(cham)} 님이 진행자예요`);
    }
    return `<div class="banner ${cls}">${title}</div><div class="reveal">${accCard}</div>
    <p style="text-align:center">${desc}</p>
    <div class="secretline">비밀 단어: <b>${s.coord}</b> → <b class="sw">${esc(s.word)}</b></div>${votes}${btn}`;}
  }
  return '';
}

const $app=document.getElementById('app');
function render(){
  const vals={};document.querySelectorAll('#app input').forEach(el=>{if(el.id&&el.type!=='checkbox')vals[el.id]=el.value});
  const a=document.activeElement,fid=a&&a.id&&a.closest&&a.closest('#app')?a.id:null,sel=fid?a.selectionStart:null;
  let h='';
  if(S.screen==='home')h=homeHTML();
  else if(S.screen==='localSetup')h=localSetupHTML();
  else if(S.screen==='online')h=onlineHTML();
  else if(S.screen==='game'&&S.G)h=gameHTML();
  $app.innerHTML=h;
  for(const id in vals){const el=document.getElementById(id);if(el&&el.tagName==='INPUT')el.value=vals[id]}
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
  animateDice();tickTimer();
  if(S.mode==='online'){const lb=document.getElementById('lobbyChat');if(lb)lb.scrollTop=lb.scrollHeight}
}
function animateDice(){
  const G=S.G;if(S.screen!=='game'||!G||!G.dice||S.shownRoll===G.rollId)return;
  S.shownRoll=G.rollId;let k=0;
  const iv=setInterval(()=>{
    const a=document.getElementById('d6'),b=document.getElementById('d8');k++;
    if(k>14||!S.G||!S.G.dice){clearInterval(iv);if(a){a.classList.remove('rolling');a.innerHTML=d6SVG(S.G.dice.y,70)}if(b){b.classList.remove('rolling');b.innerHTML=d8SVG(S.G.dice.b,70)}return}
    if(a){a.classList.add('rolling');a.innerHTML=d6SVG(1+rint(6),70)}
    if(b){b.classList.add('rolling');b.innerHTML=d8SVG(1+rint(8),70)}
  },70);
}
function tickTimer(){
  const el=document.getElementById('timer');if(!el||!S.G||!S.G.debateAt)return;
  const left=Math.max(0,120-Math.floor((nowMs()-S.G.debateAt)/1000));
  el.textContent=left?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'투표할 시간!';
  el.classList.toggle('end',!left);
}
setInterval(tickTimer,500);

const $modal=document.getElementById('modal');
function showModal(h,lock){$modal.innerHTML=h;$modal.classList.add('show');if(lock)$modal.dataset.lock='1';else delete $modal.dataset.lock}
function closeModal(){$modal.classList.remove('show');$modal.innerHTML='';delete $modal.dataset.lock}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2600)}

const RULES=`<div class="modal-in rules"><h2 style="text-align:center">📖 카멜레온 규칙</h2>
<p><b>목표</b> — 카멜레온이 아니라면: 비밀 단어를 들키지 않으면서 카멜레온을 찾아내기. 카멜레온이라면: 들키지 않고 섞여들며 비밀 단어를 알아내기.</p>
<ol>
<li><b>준비</b> (3~8명): 코드 카드 덱에 카멜레온 카드 1장을 섞어 한 장씩 나눠요. 한 명이 카멜레온!</li>
<li><b>진행자</b>가 토픽 카드(단어 16개)를 펼치고 <b>노랑(6면)·파랑(8면)</b> 주사위를 굴려요. 코드 카드에서 두 눈이 가리키는 좌표(예: B3)가 토픽 카드의 <b>비밀 단어</b>예요. 카멜레온은 코드 카드가 없어서 몰라요.</li>
<li><b>진행자부터 시계방향으로</b> 모두(카멜레온 포함) 비밀 단어와 관련된 단어를 하나씩 말해요. 다른 사람이 말한 단어를 똑같이 말해도 돼요.</li>
<li><b>토론</b> 후, 하나 둘 셋에 <b>동시에</b> 카멜레온이라고 생각하는 사람을 가리켜요. 최다 득표자가 카드를 공개! 동점이면 <b>진행자가 결정표</b>를 가져요.</li>
<li>코드 카드였다면 → 카멜레온 탈출. 카멜레온이었다면 → 카멜레온에게 <b>비밀 단어를 맞힐 기회 1번</b>. 맞히면 탈출!</li>
<li>이번 라운드의 카멜레온이 <b>다음 진행자</b>가 되고, 코드 카드 덱(파랑↔초록)을 바꿔 진행해요.</li>
</ol>
<p><b>점수</b><br>· 카멜레온이 들키지 않음: 카멜레온 +2<br>· 잡혔지만 비밀 단어를 맞힘: 카멜레온 +1<br>· 잡히고 틀림: 나머지 모두 +2<br>먼저 <b>5점</b>을 얻은 사람이 승리!</p>
<p><b>인원 변형</b><br>· 3명: 잡힌 카멜레온이 비밀 단어를 2번 추측<br>· 7~8명: 모두 단어를 말하면 토픽 카드를 뒤집어 둠</p>
<button class="big" onclick="App.closeModal()">알겠어요!</button></div>`;

/* ================= 액션 ================= */
function curSettings(){return S.screen==='localSetup'?S.localSettings:S.G.settings}
window.App={
  home(){S.screen='home';render()},
  goLocal(){S.screen='localSetup';render()},
  goOnline(){S.screen='online';render()},
  rules(){showModal(RULES)},
  closeModal,
  setName(i,v){S.localNames[i]=v},
  addName(){if(S.localNames.length<8){S.localNames.push('');render()}},
  delName(i){if(S.localNames.length>3){S.localNames.splice(i,1);render()}},
  setSetting(k,v){
    if(S.screen==='localSetup'){S.localSettings[k]=v;render()}
    else if(S.mode==='local'){S.G.settings[k]=v;render()}
    else dispatch({t:'settings',s:{[k]:v}});
  },
  editCustom(){
    const c=curSettings().custom||{name:'',words:Array(16).fill('')};const w=toArr(c.words);
    showModal(`<div class="modal-in wide"><h2>✏️ 나만의 토픽 카드</h2><p class="muted">화이트보드 토픽 카드처럼 주제와 단어 16개를 직접 적어요.</p>
    <input id="cuName" maxlength="12" placeholder="주제 (예: 우리 반)" value="${esc(c.name)}">
    <div class="cugrid">${Array.from({length:16},(_,i)=>`<input id="cu${i}" maxlength="10" value="${esc(w[i]||'')}" placeholder="${COLS[i%4]}${Math.floor(i/4)+1}">`).join('')}</div>
    <div class="row"><button class="green" onclick="App.saveCustom()">저장</button><button class="ghostdark" onclick="App.clearCustom()">삭제</button><button class="ghostdark" onclick="App.closeModal()">닫기</button></div></div>`,true);
  },
  saveCustom(){
    const c={name:document.getElementById('cuName').value.trim(),words:Array.from({length:16},(_,i)=>document.getElementById('cu'+i).value.trim())};
    if(!customOk(c))return toast('주제와 16칸을 모두 채워 주세요');
    closeModal();App.setSetting('custom',c);toast('나만의 토픽 카드 저장! 진행자가 “직접 고르기”에서 쓸 수 있어요');
  },
  clearCustom(){closeModal();App.setSetting('custom',null)},
  startLocal(){
    const names=S.localNames.map((v,i)=>v.trim()||`플레이어 ${i+1}`);
    if(names.length<3||names.length>8)return toast('3~8명이 필요해요');
    S.mode='local';S.screen='game';S.shownRoll=null;
    S.G=norm({phase:'lobby',players:{},settings:JSON.parse(JSON.stringify(S.localSettings))});
    dispatch({t:'start',players:names.map((n,i)=>({id:'p'+i,name:n}))});
  },
  act(a){if(S.mode==='online'&&a.pid===undefined)a.pid=ME();dispatch(a)},
  startVote(){S.vc={};App.act({t:'startVote'})},
  peekLocal(p){
    showModal(`<div class="modal-in"><h2>👀 ${nm(p)} 님만 보세요</h2><p>다른 사람은 고개를 돌려 주세요!</p><div style="margin:14px 0;display:flex;justify-content:center">${cardBackHTML(S.G.deck,`App.peekShow('${p}')`)}</div><button class="big" onclick="App.peekShow('${p}')">카드 뒤집기</button><button class="ghostdark sm" style="margin-top:10px" onclick="App.closeModal()">취소</button></div>`,true);
  },
  peekShow(p){showModal(`<div class="modal-in"><div style="display:flex;justify-content:center">${cardFace(S.G,p)}</div><button class="big green" onclick="App.peekDone('${p}')">확인했어요 (가리고 넘기기)</button></div>`,true)},
  peekDone(p){closeModal();if(S.G.phase==='check'&&!S.G.ready[p])dispatch({t:'ready',pid:p});else render()},
  repeek(){showModal(`<div class="modal-in"><h2>누구의 카드인가요?</h2><div class="pgrid">${S.G.order.map(p=>`<button onclick="App.peekLocal('${p}')">${nm(p)}</button>`).join('')}</div><button class="ghostdark sm" onclick="App.closeModal()">닫기</button></div>`)},
  togglePeek(){const k=S.G.round+'-'+S.G.rollId;if(S.peek&&S.peekKey===k)S.peek=false;else{S.peek=true;S.peekKey=k}render()},
  localClue(){const G=S.G,el=document.getElementById('lclue'),w=el?el.value.trim():'';if(el)el.value='';dispatch({t:'clue',pid:speakers(G)[G.turn],word:w})},
  sendClue(){const el=document.getElementById('clueIn'),w=el?el.value.trim():'';if(!w)return toast('단어를 입력해 주세요');el.value='';App.act({t:'clue',word:w})},
  vcAdd(p,d){S.vc[p]=Math.max(0,(S.vc[p]||0)+d);render()},
  localVoteDone(){
    const G=S.G,sum=G.order.reduce((s,p)=>s+(S.vc[p]||0),0);
    if(sum!==G.order.length&&!confirm(`표 합계가 ${sum}표예요 (인원 ${G.order.length}명). 이대로 공개할까요?`))return;
    const c={};G.order.forEach(p=>{if(S.vc[p])c[p]=S.vc[p]});dispatch({t:'localVote',counts:c});
  },
  guessPick(i){
    const w=getTopic(S.G).words[i];
    showModal(`<div class="modal-in"><h2>“${esc(w)}”</h2><p>이 단어로 답할까요?</p><div class="row"><button class="green" onclick="App.closeModal();App.act({t:'guess',word:${esc(JSON.stringify(w))}})">정답!</button><button class="ghostdark" onclick="App.closeModal()">다시 고르기</button></div></div>`);
  },
  guessType(){const el=document.getElementById('gIn'),w=el?el.value.trim():'';if(!w)return toast('단어를 입력해 주세요');el.value='';App.act({t:'guess',word:w})},
  restart(){
    if(S.mode==='local'){const players=S.G.order.map(p=>({id:p,name:S.G.players[p].name}));const st=S.G.settings;S.G=norm({phase:'lobby',players:{},settings:st});S.shownRoll=null;dispatch({t:'start',players})}
    else dispatch({t:'toLobby'});
  },
  leave(){
    if(S.mode==='local'){if(confirm('게임을 끝내고 처음 화면으로 갈까요?')){S.G=null;S.mode=null;S.screen='localSetup';render()}return}
    const playing=S.G&&S.G.phase!=='lobby';
    showModal(`<div class="modal-in"><h2>나갈까요?</h2><p>${playing?'게임이 아직 진행 중이에요. 자리는 남아 있어서 같은 방 코드나 “돌아가기”로 다시 들어오면 이어서 할 수 있어요. 그동안 내 차례가 오면 다른 사람이 대신 진행할 수 있어요.':'대기실에서 나가요.'}</p>
      <div class="row"><button class="ghostdark" onclick="App.closeModal()">취소</button><button class="red" onclick="App.closeModal();App.doLeave()">나가기</button></div></div>`);
  },
  doLeave(){doLeave()},
  kick(p){dispatch({t:'kick',pid:p})},
  takeover(id){S.takeover=id;if(id)toast(`${nm(id)} 님 대신 진행해요`);render()},
  openChat(){openChat()},closeChat(){closeChat()},
  quick(i){sendChat(QUICK[i])},
  chatSubmit(ev,id){if(ev)ev.preventDefault();const el=document.getElementById(id);if(el&&sendChat(el.value))el.value='';return false},
  diag(){runDiag()},
  forgetRoom(){lsDel(ROOM_KEY);render()},
  copyLink(){
    const url=location.origin+location.pathname+'?room='+S.code;
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('초대 링크를 복사했어요')).catch(()=>prompt('이 링크를 복사하세요',url));
  },
  myName(){const n=(document.getElementById('onName').value||'').trim().slice(0,10);if(n){S.name=n;lsSet('cham_name',n)}return n},
  async create(){
    if(!checkFB())return;
    const name=App.myName();if(!name)return toast('이름을 입력해 주세요');
    try{
      let code;for(let i=0;i<8;i++){code=genCode();const s=await db.ref(ROOT+'/'+code).get();if(!s.exists())break}
      await db.ref(ROOT+'/'+code).set({host:S.me,phase:'lobby',createdAt:TS(),settings:{target:5,hideBig:true,two3:true,level:2},
        players:{[S.me]:{name,joined:Date.now(),score:0,online:true}}});
      enterRoom(code);
    }catch(e){toast(fbErrMsg(e));showFbError(e)}
  },
  async join(){
    if(!checkFB())return;
    const name=App.myName();if(!name)return toast('이름을 입력해 주세요');
    const code=(document.getElementById('onCode').value||'').trim().toUpperCase();
    if(code.length!==4)return toast('방 코드 4자리를 입력해 주세요');
    try{
      const snap=await db.ref(ROOT+'/'+code).get();if(!snap.exists())return toast('그런 방이 없어요');
      const room=snap.val();
      /* 탭을 복제하면 같은 번호를 갖게 됨 → 이미 그 번호로 접속 중이면 새 번호를 받음 */
      if(room.players&&room.players[S.me]){
        let active=false;
        try{const p=(await db.ref(`${PRES_PATH}/${code}/${S.me}`).get()).val();
          const age=p&&p.lastSeen?Date.now()-p.lastSeen:Infinity;active=!!p&&p.connected!==false&&age>=0&&age<15000}catch(e){}
        if(active)setPid(newUid());
      }
      let err=null;
      db.ref(ROOT+'/'+code).transaction(cur=>{if(cur===null)return cur;try{err=null;return clean(reduce(cur,{t:'join',pid:S.me,name}))}catch(e){err=e;return}},(e,ok)=>{
        if(e){toast(fbErrMsg(e));return showFbError(e)}if(err)return toast(err);if(ok)enterRoom(code);
      });
    }catch(e){toast(fbErrMsg(e));showFbError(e)}
  },
  async resume(){
    const sv=savedRoom();if(!sv)return;
    if(!checkFB())return;
    try{
      const sn=await db.ref(ROOT+'/'+sv.code).get();
      if(!sn.exists()){toast('그 방은 이미 닫혔어요');lsDel(ROOM_KEY);return render()}
      const r=sn.val();
      if(!r.players||!r.players[sv.id]||!r.players[sv.id].name){toast('그 방에 내 자리가 없어요');lsDel(ROOM_KEY);return render()}
      setPid(sv.id);enterRoom(sv.code);
    }catch(e){toast(fbErrMsg(e));showFbError(e)}
  }
};

/* 초대 링크로 들어온 경우 */
(function(){try{const r=new URLSearchParams(location.search).get('room');if(r){S.prefill=r.toUpperCase().slice(0,4);S.screen='online'}}catch(e){}render()})();
</script>
